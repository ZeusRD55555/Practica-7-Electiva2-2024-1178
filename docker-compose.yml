version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: hola_mundo_web
    ports:
      - '8080:80'
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    container_name: hola_mundo_api
    environment:
      - DB_HOST=db
      - DB_NAME=holamundo
      - DB_USER=holamundo
      - DB_PASS=holamundo
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: hola_mundo_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: holamundo
      MYSQL_USER: holamundo
      MYSQL_PASSWORD: holamundo
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:
